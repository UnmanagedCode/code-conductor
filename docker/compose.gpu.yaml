# Optional override: forward the host GPU (main use: ollama with CUDA).
# Enable via `make CC_GPU=1 up`. Requires nvidia-container-toolkit on the host.
# Compose ≥ v2.30 (2024-09). On older compose use instead:
#   deploy:
#     resources:
#       reservations:
#         devices:
#           - driver: nvidia
#             count: all
#             capabilities: [gpu]
services:
  conductor:
    gpus: all